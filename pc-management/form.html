<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登録・編集 | パソコン管理</title>
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="../style.css?v=160" />
    <link rel="stylesheet" href="pwa.css?v=164" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>パソコン管理</h1>
        <p class="subtitle">登録・編集</p>
      </header>

      <section id="form-panel" class="panel" aria-labelledby="form-title">
        <h2 id="form-title">入力フォーム</h2>
        <p id="auth-error" class="form-error"></p>
        <form id="pc-form" novalidate>
          <input id="pc-id" type="hidden" />

          <label for="part-name">商品名（パーツ）</label>
          <input id="part-name" type="text" autocomplete="off" required />
          <label for="model-number">型番</label>
          <input id="model-number" type="text" autocomplete="off" required />
          <label for="pc-name">分類（パソコン名）</label>
          <select id="pc-name" required>
            <option value="main">メインPC</option>
            <option value="sub">サブPC</option>
          </select>
          <label for="spec-detail">スペック（詳細入力欄）</label>
          <textarea id="spec-detail" rows="4"></textarea>
          <label for="purchase-date">購入日</label>
          <input id="purchase-date" type="date" required />
          <label for="purchase-price">購入価格（円）</label>
          <input id="purchase-price" type="number" inputmode="numeric" min="0" step="1" required />
          <label for="years-of-use">使用予定年数（年）</label>
          <input id="years-of-use" type="number" inputmode="numeric" min="1" step="1" value="10" required />
          <label for="end-of-use-date">使用終了日</label>
          <input id="end-of-use-date" type="date" />
          <label for="memo">メモ</label>
          <input id="memo" type="text" autocomplete="off" placeholder="メモ" />

          <section id="pc-sale-controls" class="pc-sale-controls" aria-label="売却の操作" hidden>
            <div class="pc-sale-actions">
              <button type="button" class="ghost-button" data-sale="open" aria-expanded="false">売却</button>
              <button type="button" class="ghost-button pc-sale-remove" data-sale="remove" hidden>売却記録を削除</button>
            </div>
            <div class="pc-sale-entry" data-sale="entry" hidden>
              <label for="pc-sale-date">売却日</label>
              <input id="pc-sale-date" data-sale="date" type="date" />
              <label for="pc-sale-price">売却価格・手取り（円）</label>
              <input id="pc-sale-price" data-sale="amount" type="number" min="0" step="1" inputmode="numeric" />
              <p class="pc-sale-note">手数料・送料を引いて受け取った金額を入力してください。</p>
              <div data-sale="months-field" hidden>
                <label for="pc-sale-months">予定期間終了後の分割月数</label>
                <input id="pc-sale-months" data-sale="months" type="number" min="1" max="1200" step="1" value="12" />
              </div>
              <p data-sale="error" class="form-error" role="alert"></p>
              <div class="pc-sale-actions">
                <button type="button" class="ghost-button" data-sale="cancel">キャンセル</button>
                <button type="button" class="primary-button" data-sale="confirm" disabled>決定</button>
              </div>
            </div>
            <p class="pc-sale-note">売却内容の決定・変更・削除は、下の「更新する」で保存されます。</p>
          </section>

          <section class="calculation-result pc-cost-result" aria-label="計算結果">
            <div>
              <span>合計</span>
              <strong id="calculation-total">¥0</strong>
            </div>
            <div>
              <span>月額コスト</span>
              <strong id="calculation-monthly-cost">¥0 /月</strong>
            </div>
            <div>
              <span>調整分</span>
              <strong id="calculation-adjustment">—</strong>
              <small id="calculation-adjustment-note">最終月に加算</small>
            </div>
          </section>

          <section id="pc-sale-result" class="pc-sale-result" aria-label="売却後の計算結果" aria-live="polite" hidden>
            <p data-sale="formula" class="pc-sale-formula" hidden></p>
            <div data-sale="summary" hidden>
              <dl>
                <div><dt>売却価格（手取り）</dt><dd data-sale="sale-price"></dd></div>
                <div><dt data-sale="balance-label">売却後の残金</dt><dd data-sale="balance"></dd></div>
                <div class="pc-sale-cost-pair">
                  <div><dt>売却後の月額コスト</dt><dd data-sale="after"></dd></div>
                  <div><dt>調整分</dt><dd data-sale="adjustment"></dd></div>
                </div>
                <div><dt>適用期間</dt><dd data-sale="period"></dd></div>
              </dl>
              <p data-sale="rounding" class="pc-sale-note"></p>
            </div>
          </section>

          <p id="form-error" class="form-error"></p>
          <div class="checkbox-row">
            <label class="checkbox-field" for="hide-from-timeline">
              <input id="hide-from-timeline" type="checkbox" />
              <span>帯を表示しない</span>
            </label>
          </div>
          <div class="form-actions">
            <button id="submit-button" class="primary-button" type="submit">登録する</button>
          </div>
          <button id="to-list-button" class="ghost-button" type="button">一覧に戻る</button>
        </form>
      </section>
    </main>
    <script type="module" src="pwa.js"></script>
    <script type="module" src="app.js?v=164"></script>
  </body>
</html>
